name: Phase I CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: 3D-Drone-Swarm-Phase1-v0.3.0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 3D-Drone-Swarm-Phase1-v0.3.0/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pipeline,viz]"
      - name: Static checks
        run: |
          python -m ruff check src tests examples scripts
          python -m ruff format --check src tests examples scripts
          python -m mypy src
      - name: Unit tests
        run: python -m pytest
      - name: End-to-end CSV smoke run
        run: |
          drone-swarm run \
            --config configs/smoke/smoke_split.yaml \
            --seed 7 \
            --output-root outputs/ci-smoke \
            --formats csv \
            --validation-level full
          drone-swarm catalog \
            --output-root outputs/ci-smoke \
            --strict \
            --no-parquet \
            --validation-level full
      - name: End-to-end Parquet smoke run with uint64 seeds
        run: |
          drone-swarm run \
            --config configs/smoke/smoke_split.yaml \
            --seed 0 \
            --output-root outputs/ci-parquet-smoke \
            --formats parquet \
            --validation-level full
          drone-swarm catalog \
            --output-root outputs/ci-parquet-smoke \
            --strict \
            --validation-level full
      - name: Replay and validate CSV and Parquet observations
        run: |
          for format in csv parquet; do
            if [ "$format" = csv ]; then
              source_root=outputs/ci-smoke
            else
              source_root=outputs/ci-parquet-smoke
            fi
            for run_directory in "$source_root"/raw/*; do
              replay_directory="outputs/replay-$format/$(basename "$run_directory")"
              drone-swarm replay "$run_directory" --output-directory "$replay_directory"
              drone-swarm validate-observations "$replay_directory/observations.jsonl" \
                --metadata "$replay_directory/metadata.json"
            done
          done
      - name: Check source scripts
        run: bash -n scripts/*.sh
