schema_version: 1
scenario_id: communication_dropout_step
paired_control_scenario: nominal_boids
analysis_split: pilot
description: Receiver-side edge dropout localized to one deterministic half of the swarm.
run: {steps: 8000, metrics_stride: 10, transition_batch_size: 20000, progress_interval: 1000}
model:
  n_drones: 48
  bounds: [[0.0, 50.0], [0.0, 50.0], [0.0, 25.0]]
  dt: 0.25
  perception_radius: 14.0
  separation_distance: 2.5
  collision_radius: 0.75
  max_speed: 3.0
  max_acceleration: 0.5
  boundary_mode: bounce
  boundary_margin: 4.0
  target_position: [25.0, 25.0, 12.5]
  activation: staged
policy: {type: boids, cohesion_weight: 0.025, alignment_weight: 0.05, separation_weight: 0.25, goal_weight: 0.02, boundary_weight: 1.0}
initialization:
  positions: {type: gaussian, center: [25.0, 25.0, 12.5], std: [8.0, 8.0, 4.0]}
  velocities: {type: random}
agents:
  initial_coalitions: {strategy: single, label: all}
  restrict_interactions_to_coalition: false
  formation_id: cloud
phases:
  - {name: warmup, start: 0, end: 1500}
  - {name: baseline, start: 1500, end: 4000}
  - {name: communication_fault, start: 4000}
events:
  - id: dropout_on_A_receivers
    kind: communication_dropout
    intent: fault
    schedule: {start: 4000, shape: step}
    targets: {fraction: 0.50, selection_seed: 23}
    parameters:
      probability: 0.60
output: {formats: [parquet], write_agent_signals: true}
