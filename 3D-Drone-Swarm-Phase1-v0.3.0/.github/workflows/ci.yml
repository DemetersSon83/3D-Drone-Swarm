name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pipeline]"
      - name: Static checks
        run: |
          python -m ruff check src tests examples scripts
          python -m ruff format --check src tests examples scripts
          python -m mypy src
      - name: Unit tests
        run: python -m pytest
      - name: End-to-end CSV smoke run
        run: |
          drone-swarm run \
            --config configs/smoke/smoke_split.yaml \
            --seed 7 \
            --output-root outputs/ci-smoke \
            --formats csv \
            --validation-level full
          drone-swarm catalog \
            --output-root outputs/ci-smoke \
            --strict \
            --no-parquet \
            --validation-level full
      - name: End-to-end Parquet smoke run with uint64 seeds
        run: |
          drone-swarm run \
            --config configs/smoke/smoke_split.yaml \
            --seed 0 \
            --output-root outputs/ci-parquet-smoke \
            --formats parquet \
            --validation-level full
          drone-swarm catalog \
            --output-root outputs/ci-parquet-smoke \
            --strict \
            --validation-level full
      - name: Check source scripts
        run: bash -n scripts/*.sh
